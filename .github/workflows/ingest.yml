name: Ingest - Reticle

# Triggers the multi-source ingestion pipeline on a schedule.
# The backend has no in-process scheduler on purpose: on Render's free tier
# the service hibernates without traffic, so an @Scheduled bean would not run
# reliably. This workflow is what wakes the service up and drives the run.
on:
  schedule:
    # Every 6 hours (UTC). Adjust here to change the cadence.
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  trigger-ingestion:
    name: Trigger ingestion pipeline
    runs-on: ubuntu-latest

    env:
      API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
      API_KEY: ${{ secrets.INGESTION_API_KEY }}

    steps:
      # Wakes the backend: on Render's free tier the cold start takes ~1min,
      # and the ingestion itself is already long enough that we don't want
      # to fold the cold start into the same timeout.
      - name: Wake the backend
        run: |
          curl --silent --output /dev/null \
            --max-time 120 \
            --retry 5 --retry-delay 15 --retry-all-errors \
            "$API_URL/health" || echo "Health check failed; continuing anyway."

      # Runs the pipeline. The collection makes ~185 requests plus one LLM
      # call, so the timeout is intentionally generous.
      - name: Run ingestion
        run: |
          HTTP_STATUS=$(curl --silent --output response.json \
            --write-out "%{http_code}" \
            --max-time 300 \
            --request POST \
            --header "X-API-Key: $API_KEY" \
            "$API_URL/api/v1/ingest")

          echo "Response (HTTP $HTTP_STATUS):"
          cat response.json || true
          echo

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Ingestion failed (HTTP $HTTP_STATUS)"
            exit 1
          fi

          # Layered checks: any signal of degraded curation must fail the
          # workflow, not just the LLM-keyword fallback.
          if grep -q '"status":"degraded"' response.json; then
            echo "Status 'degraded' - backend reported a curation problem."
            exit 1
          fi

          if grep -q 'keyword-fallback' response.json; then
            echo "Degraded curation - LLM failed (see llmError above)."
            exit 1
          fi

          if grep -q '"llmError"' response.json; then
            echo "llmError present in the response - see above."
            exit 1
          fi

          echo "Ingestion completed"
