# Test profile: disable Flyway (the migration SQL uses Postgres-only
# extensions like gen_random_uuid()) and keep schema.sql-driven init for
# embedded H2. Existing tests run under @WebMvcTest with @MockBean, so the
# database is never actually queried — these settings exist to keep
# full-context integration tests sane when they are added.
spring.flyway.enabled=false
spring.sql.init.mode=always
