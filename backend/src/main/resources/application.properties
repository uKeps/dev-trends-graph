# =============================================================
# Trend mapper for the software development and AI bubble.
# application.properties - Spring Boot 3 configuration.
# =============================================================

# ---- Server -------------------------------------------------
# Render injects the PORT env var dynamically.
server.port=${PORT:8080}
spring.application.name=reticle

# ---- Database (Supabase / PostgreSQL) -----------------------
# Configure via environment variables in the Render dashboard:
# DATABASE_URL=jdbc:postgresql://<host>:5432/<db>?sslmode=require
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP connection pool - tuned for 512MB on Render's free tier.
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.connection-test-query=SELECT 1

# ---- JdbcTemplate -------------------------------------------
spring.jdbc.template.fetch-size=100

# ---- Flyway -------------------------------------------------
# Versioned schema migrations. baseline-on-migrate=true lets the migration
# run on databases that pre-date Flyway by treating the existing schema as
# the baseline (V1 is a no-op via IF NOT EXISTS, so it is safe to apply
# again on fresh databases too).
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# ---- Resilience4j (circuit breakers) ------------------------
# Wrap each external dependency in its own circuit so a slow or broken
# source does not stall the whole ingestion. The pipeline stays alive
# even when HN is timing out — the breaker opens, Dev.to / Lobsters / SO
# and the LLM keep working, and the run completes with a partial batch.
# The 4 sources and the LLM all share the same defaults; per-circuit
# tuning can override them later if needed.
resilience4j.circuitbreaker.instances.hackernews.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.hackernews.slow-call-rate-threshold=70
resilience4j.circuitbreaker.instances.hackernews.slow-call-duration-threshold=8s
resilience4j.circuitbreaker.instances.hackernews.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.hackernews.sliding-window-size=10
resilience4j.circuitbreaker.instances.hackernews.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.hackernews.permitted-number-of-calls-in-half-open-state=3

resilience4j.circuitbreaker.instances.devto.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.devto.slow-call-rate-threshold=70
resilience4j.circuitbreaker.instances.devto.slow-call-duration-threshold=8s
resilience4j.circuitbreaker.instances.devto.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.devto.sliding-window-size=10
resilience4j.circuitbreaker.instances.devto.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.devto.permitted-number-of-calls-in-half-open-state=3

resilience4j.circuitbreaker.instances.lobsters.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.lobsters.slow-call-rate-threshold=70
resilience4j.circuitbreaker.instances.lobsters.slow-call-duration-threshold=8s
resilience4j.circuitbreaker.instances.lobsters.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.lobsters.sliding-window-size=10
resilience4j.circuitbreaker.instances.lobsters.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.lobsters.permitted-number-of-calls-in-half-open-state=3

resilience4j.circuitbreaker.instances.stackoverflow.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.stackoverflow.slow-call-rate-threshold=70
resilience4j.circuitbreaker.instances.stackoverflow.slow-call-duration-threshold=8s
resilience4j.circuitbreaker.instances.stackoverflow.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.stackoverflow.sliding-window-size=10
resilience4j.circuitbreaker.instances.stackoverflow.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.stackoverflow.permitted-number-of-calls-in-half-open-state=3

# LLM breaker is more lenient: a single 30s call counts as one sample, and
# a 429 from Groq (rate limit) should not open the breaker permanently.
resilience4j.circuitbreaker.instances.llm.failure-rate-threshold=60
resilience4j.circuitbreaker.instances.llm.slow-call-rate-threshold=80
resilience4j.circuitbreaker.instances.llm.slow-call-duration-threshold=45s
resilience4j.circuitbreaker.instances.llm.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.llm.sliding-window-size=5
resilience4j.circuitbreaker.instances.llm.wait-duration-in-open-state=2m
resilience4j.circuitbreaker.instances.llm.permitted-number-of-calls-in-half-open-state=1

# ---- Jackson / JSON -----------------------------------------
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.default-property-inclusion=non_null

# ---- LLM (OpenAI / Groq) ------------------------------------
# Configure via environment variables in Render:
# GROQ_API_KEY=gsk_...  (or OPENAI_API_KEY=sk-...)
openai.api.key=${GROQ_API_KEY:${OPENAI_API_KEY:}}
openai.api.url=${LLM_API_URL:https://api.groq.com/openai/v1/chat/completions}
openai.model=${LLM_MODEL:openai/gpt-oss-20b}

# ---- Logging ------------------------------------------------
logging.level.com.dev.trends=INFO
logging.level.org.springframework.jdbc=WARN
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# ---- Actuator (supplementary health check) ------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# ---- Cache (Caffeine) ---------------------------------------
# /api/v1/graph and /api/v1/categories are read-mostly: data only shifts after
# a new ingestion round (every 6 hours by default), so serving from a short
# in-process cache keeps the database from taking the brunt of the frontend's
# back-button navigation and rapid filter changes. TTL is well below the
# ingestion cadence so users never see a card that is more than ~5 minutes
# stale.
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=512,expireAfterWrite=5m
spring.cache.cache-names=graph,trends,categories,history
