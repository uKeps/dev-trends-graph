# =============================================================
# Trend mapper for the software development and AI bubble.
# application.properties - Spring Boot 3 configuration.
# =============================================================

# ---- Server -------------------------------------------------
# Render injects the PORT env var dynamically.
server.port=${PORT:8080}
spring.application.name=reticle

# ---- Database (Supabase / PostgreSQL) -----------------------
# Configure via environment variables in the Render dashboard:
# DATABASE_URL=jdbc:postgresql://<host>:5432/<db>?sslmode=require
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP connection pool - tuned for 512MB on Render's free tier.
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.connection-test-query=SELECT 1

# ---- JdbcTemplate -------------------------------------------
spring.jdbc.template.fetch-size=100

# ---- Jackson / JSON -----------------------------------------
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.default-property-inclusion=non_null

# ---- LLM (OpenAI / Groq) ------------------------------------
# Configure via environment variables in Render:
# GROQ_API_KEY=gsk_...  (or OPENAI_API_KEY=sk-...)
openai.api.key=${GROQ_API_KEY:${OPENAI_API_KEY:}}
openai.api.url=${LLM_API_URL:https://api.groq.com/openai/v1/chat/completions}
openai.model=${LLM_MODEL:openai/gpt-oss-20b}

# ---- Logging ------------------------------------------------
logging.level.com.dev.trends=INFO
logging.level.org.springframework.jdbc=WARN
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# ---- Actuator (supplementary health check) ------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# ---- Cache (Caffeine) ---------------------------------------
# /api/v1/graph and /api/v1/categories are read-mostly: data only shifts after
# a new ingestion round (every 6 hours by default), so serving from a short
# in-process cache keeps the database from taking the brunt of the frontend's
# back-button navigation and rapid filter changes. TTL is well below the
# ingestion cadence so users never see a card that is more than ~5 minutes
# stale.
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=512,expireAfterWrite=5m
spring.cache.cache-names=graph,trends,categories,history
