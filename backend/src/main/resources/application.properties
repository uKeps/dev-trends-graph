# =============================================================
# Mapeador de Tendências da Bolha Dev e IA em Grafos
# application.properties — configurações do Spring Boot 3
# =============================================================

# ---- Servidor -----------------------------------------------
# Render injeta a variável PORT dinamicamente
server.port=${PORT:8080}
spring.application.name=dev-trends-graph

# ---- Banco de Dados (Supabase / PostgreSQL) -----------------
# Configure via variáveis de ambiente no painel do Render:
# DATABASE_URL=jdbc:postgresql://<host>:5432/<db>?sslmode=require
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool de conexões HikariCP — otimizado para 512MB de RAM no Render free tier
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.connection-test-query=SELECT 1

# ---- JdbcTemplate -------------------------------------------
spring.jdbc.template.fetch-size=100
spring.jdbc.template.max-rows=500

# ---- Jackson / JSON -----------------------------------------
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.default-property-inclusion=non_null

# ---- LLM (OpenAI / Groq) ------------------------------------
# Configure via variáveis de ambiente no Render:
# GROQ_API_KEY=gsk_...  (ou OPENAI_API_KEY=sk-...)
openai.api.key=${GROQ_API_KEY:${OPENAI_API_KEY:}}
openai.api.url=${LLM_API_URL:https://api.groq.com/openai/v1/chat/completions}
openai.model=${LLM_MODEL:llama-3.1-8b-instant}

# ---- Logging ------------------------------------------------
logging.level.com.dev.trends=INFO
logging.level.org.springframework.jdbc=WARN
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# ---- Actuator (health check complementar) -------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# ---- Segurança: desabilita formulário de login padrão -------
spring.security.user.name=admin
spring.security.user.password=${ADMIN_PASSWORD:changeme}
